<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Lambda 사용자 관리</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #insertBtn {
      background: #007bff;
      color: white;
    }

    #deleteBtn {
      background: #dc3545;
      color: white;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #e8f5e9;
      border: 1px solid #81c784;
    }

    .warning {
      display: block !important;
      background: #fff8e1;
      border: 1px solid #ffd54f;
    }

    .error {
      display: block !important;
      background: #ffebee;
      border: 1px solid #e57373;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>사용자 관리</h1>

    <div class="form-group">
      <label for="username">이름</label>
      <input type="text" id="username" placeholder="이름을 입력하세요">
    </div>

    <div class="form-group">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="example@example.com">
    </div>

    <div class="form-group">
      <label for="age">나이</label>
      <input type="number" id="age" placeholder="나이를 입력하세요">
    </div>

    <div class="button-group">
      <button id="insertBtn">사용자 추가</button>
      <button id="deleteBtn">사용자 삭제</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    /*
     * Lambda Function URL
     */
    const LAMBDA_URL =
      "https://u2p223zkep5qubb4gbt7ikvnci0rinel.lambda-url.eu-north-1.on.aws/";

    /*
     * HTML 요소 가져오기
     */
    const usernameInput = document.getElementById("username");
    const emailInput = document.getElementById("email");
    const ageInput = document.getElementById("age");
    const insertBtn = document.getElementById("insertBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const result = document.getElementById("result");

    /*
     * 결과 출력 함수
     */
    function showResult(message, type) {
      result.className = type;
      result.innerHTML = message;
    }

    /*
     * ==============================
     * 사용자 추가
     * ==============================
     */
    insertBtn.addEventListener("click", async () => {
      const username = usernameInput.value.trim();
      const email = emailInput.value.trim();
      const age = ageInput.value.trim();

      // 입력값 확인
      if (!username || !email || !age) {
        showResult(
          "이름, 이메일, 나이를 모두 입력해주세요.",
          "warning"
        );

        return;
      }

      // Query String 생성
      const params = new URLSearchParams({
        username: username,
        email: email,
        age: age
      });

      const requestUrl = `${LAMBDA_URL}?${params.toString()}`;

      try {
        // Lambda 호출
        const response = await fetch(requestUrl, {
          method: "GET"
        });

        const data = await response.json();

        // 등록 성공
        if (response.status === 200) {
          showResult(
            `
              <strong>사용자 등록 성공</strong>
              <br>
              이메일 : ${data.email}
            `,
            "success"
          );

          // 입력창 초기화
          usernameInput.value = "";
          emailInput.value = "";
          ageInput.value = "";
        }

        // 이메일 중복
        else if (response.status === 409) {
          showResult(
            `
              <strong>등록 실패</strong>
              <br>
              이미 존재하는 이메일입니다.
            `,
            "warning"
          );
        }

        // 기타 오류
        else {
          showResult(
            `
              <strong>오류 발생</strong>
              <br>
              ${data.message}
            `,
            "error"
          );
        }
      }

      catch (error) {
        console.error(error);

        showResult(
          `
            <strong>요청 실패</strong>
            <br>
            Lambda 함수에 연결할 수 없습니다.
          `,
          "error"
        );
      }
    });

    /*
     * ==============================
     * 사용자 삭제
     * ==============================
     */
    deleteBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      // 삭제할 때는 email만 필요
      if (!email) {
        showResult(
          "삭제할 사용자의 이메일을 입력해주세요.",
          "warning"
        );

        return;
      }

      // 삭제 확인
      const deleteConfirm = confirm(
        `${email} 사용자를 정말 삭제하시겠습니까?`
      );

      if (!deleteConfirm) {
        return;
      }

      /*
       * Lambda 코드에서
       * action == "delete"
       * 일 때 삭제 처리
       */
      const params = new URLSearchParams({
        action: "delete",
        email: email
      });

      const requestUrl = `${LAMBDA_URL}?${params.toString()}`;

      try {
        // Lambda 호출
        const response = await fetch(requestUrl, {
          method: "GET"
        });

        const data = await response.json();

        // 삭제 성공
        if (response.status === 200) {
          showResult(
            `
              <strong>사용자 삭제 성공</strong>
              <br>
              삭제 이메일 : ${data.email}
            `,
            "success"
          );

          // 입력창 초기화
          usernameInput.value = "";
          emailInput.value = "";
          ageInput.value = "";
        }

        // 사용자 없음
        else if (response.status === 404) {
          showResult(
            `
              <strong>삭제 실패</strong>
              <br>
              해당 이메일의 사용자가 없습니다.
            `,
            "warning"
          );
        }

        // 기타 오류
        else {
          showResult(
            `
              <strong>오류 발생</strong>
              <br>
              ${data.message}
            `,
            "error"
          );
        }
      }

      catch (error) {
        console.error(error);

        showResult(
          `
            <strong>요청 실패</strong>
            <br>
            Lambda 함수에 연결할 수 없습니다.
          `,
          "error"
        );
      }
    });
  </script>
</body>

</html>
