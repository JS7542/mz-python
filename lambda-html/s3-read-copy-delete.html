<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Lambda S3 File Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #f4f6f8;
            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #555;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .bucket-row {
            display: flex;
            gap: 10px;
        }

        .bucket-row select {
            flex: 1;
        }

        .bucket-row button {
            width: 130px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .bucket-button {
            background: #555;
            color: white;
        }

        .read-button {
            background: #1976d2;
            color: white;
        }

        .delete-button {
            background: #d32f2f;
            color: white;
        }

        .copy-button {
            background: #388e3c;
            color: white;
        }

        .result-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #status {
            font-size: 14px;
            color: #666;
        }

        #result {
            background: #1e1e1e;
            color: #eeeeee;
            min-height: 250px;
            max-height: 600px;
            overflow: auto;
            padding: 20px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family:
                Consolas,
                monospace;
            font-size: 14px;
        }

        .copy-area {
            border-top: 1px solid #ddd;
            padding-top: 20px;
            margin-top: 20px;
        }

        .small {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .current-key {
            margin-top: 10px;
            background: #f7f7f7;
            padding: 12px;
            border-radius: 5px;
            font-family:
                Consolas,
                monospace;
        }

        @media (max-width: 700px) {
            .row {
                grid-template-columns: 1fr;
            }

            .bucket-row {
                flex-direction: column;
            }

            .bucket-row button {
                width: 100%;
            }
        }
    </style>
</head>


<body>


    <div class="container">


        <h1>
            AWS Lambda S3 File Manager
        </h1>


        <div class="description">

            Lambda Function URL을 이용하여
            S3 객체를 조회, 삭제, 복사합니다.

        </div>

        <!-- ====================================================== -->
        <!-- Lambda URL -->
        <!-- ====================================================== -->

        <div class="card">

            <h2>
                Lambda Function URL
            </h2>


            <div class="form-group">

                <label for="readUrl">
                    Read Lambda URL
                </label>

                <input type="text" id="readUrl"
                    value="https://wpceqlptqhhdlsku3x66xkm4fm0znfed.lambda-url.eu-north-1.on.aws/">

            </div>



            <div class="form-group">

                <label for="deleteUrl">
                    Delete Lambda URL
                </label>

                <input type="text" id="deleteUrl"
                    value="https://dgzvyhzy6qlw7lo4gr2jfxunxa0farxq.lambda-url.eu-north-1.on.aws/">

            </div>



            <div class="form-group">

                <label for="copyUrl">
                    Copy Lambda URL
                </label>

                <input type="text" id="copyUrl"
                    value="https://uvzrev6o5bngyjol5ttytywsxy0nmijq.lambda-url.eu-north-1.on.aws/">

            </div>

        </div>

        <!-- ====================================================== -->
        <!-- S3 Object -->
        <!-- ====================================================== -->

        <div class="card">
            <h2>
                S3 객체 선택
            </h2>
            <!-- Bucket -->

            <div class="form-group">
                <label for="bucket">
                    버킷
                </label>

                <div class="bucket-row">
                    <select id="bucket">
                        <option value="">
                            버킷 조회 버튼을 눌러주세요.
                        </option>
                    </select>
                    <button type="button" class="bucket-button" onclick="loadBuckets()">
                        버킷 조회
                    </button>
                </div>

            </div>

            <!-- Directory / File -->
            <div class="row">

                <div class="form-group">
                    <label for="directory">
                        디렉터리
                    </label>
                    <input type="text" id="directory" value="Root" placeholder="Root 또는 07.15">
                    <div class="small">
                        버킷 최상위 경로는 Root로 입력합니다.
                    </div>
                </div>

                <div class="form-group">
                    <label for="fileName">
                        파일명
                    </label>
                    <input type="text" id="fileName" placeholder="예: lambda_function.py">
                </div>

            </div>
            <!-- Current Object -->
            <div class="current-key">
                선택 객체 :
                <span id="currentObject">
                    -
                </span>
            </div>

            <!-- ================================================== -->
            <!-- COPY -->
            <!-- ================================================== -->

            <div class="copy-area">
                <h2>
                    복사 목적지
                </h2>
                <div class="form-group">
                    <label for="destinationBucket">
                        목적지 버킷
                    </label>
                    <select id="destinationBucket">
                        <option value="same">
                            원본 버킷과 동일
                        </option>
                    </select>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="destinationDirectory">
                            목적지 디렉터리
                        </label>
                        <input type="text" id="destinationDirectory" value="Root" placeholder="Root 또는 07.30">
                    </div>

                    <div class="form-group">
                        <label for="destinationFile">
                            목적지 파일명
                        </label>
                        <input type="text" id="destinationFile" placeholder="비워두면 원본 파일명 사용">
                    </div>

                </div>

            </div>

            <!-- ================================================== -->
            <!-- Buttons -->
            <!-- ================================================== -->

            <div class="buttons">
                <button class="read-button" onclick="readFile()">
                    읽기
                </button>
                <button class="delete-button" onclick="deleteFile()">
                    삭제
                </button>
                <button class="copy-button" onclick="copyFile()">
                    복사
                </button>
            </div>
        </div>

        <!-- ====================================================== -->
        <!-- Result -->
        <!-- ====================================================== -->

        <div class="card">
            <div class="result-title">
                <h2>
                    실행 결과
                </h2>
                <span id="status">
                    대기 중
                </span>
            </div>
            <pre id="result">버킷 조회 버튼을 눌러 S3 버킷 목록을 불러오세요.</pre>
        </div>
    </div>


    <script>

        // =========================================================
        // URL 생성
        // =========================================================

        function createUrl(baseUrl, params) {

            const url = new URL(baseUrl);

            Object.keys(params).forEach(
                key => {
                    if (
                        params[key] !== undefined &&
                        params[key] !== null
                    ) {
                        url.searchParams.set(
                            key,
                            params[key]
                        );
                    }
                }
            );

            return url.toString();
        }

        // =========================================================
        // 결과 출력
        // =========================================================

        function setResult(status, content) {

            document
                .getElementById("status")
                .textContent = status;

            document
                .getElementById("result")
                .textContent = content;
        }

        // =========================================================
        // S3 Bucket 목록 조회
        // =========================================================

        async function loadBuckets() {

            const readUrl = document.getElementById("readUrl").value.trim();

            if (!readUrl) {
                alert("Read Lambda URL을 입력해주세요.");

                return;
            }

            const requestUrl = createUrl(
                readUrl, {
                action: "list-buckets"
            }
            );

            setResult(
                "버킷 조회 중...",
                "GET " + requestUrl
            );

            try {
                const response =
                    await fetch(
                        requestUrl, {
                        method: "GET"
                    }
                    );

                const text = await response.text();
                if (!response.ok) {
                    throw new Error(text);
                }

                const data = JSON.parse(text);
                const bucketSelect =
                    document.getElementById(
                        "bucket"
                    );

                const destinationBucketSelect =
                    document.getElementById(
                        "destinationBucket"
                    );

                // 기존 옵션 제거
                bucketSelect.innerHTML = "";

                // 목적지 버킷 초기화
                destinationBucketSelect.innerHTML = "";

                // 원본과 동일 옵션
                const sameOption =
                    document.createElement(
                        "option"
                    );

                sameOption.value = "same";
                sameOption.textContent = "원본 버킷과 동일";
                destinationBucketSelect.appendChild(
                    sameOption
                );

                // =================================================
                // 버킷이 하나도 없는 경우
                // =================================================
                if (
                    !data.buckets ||
                    data.buckets.length === 0
                ) {
                    const option =
                        document.createElement(
                            "option"
                        );
                    option.value = "";
                    option.textContent =
                        "조회 가능한 버킷이 없습니다.";

                    bucketSelect.appendChild(
                        option
                    );

                    setResult(
                        "버킷 조회 완료",
                        "조회 가능한 버킷이 없습니다."
                    );

                    return;
                }

                // =================================================
                // 버킷 목록 추가
                // =================================================

                data.buckets.forEach(
                    bucketName => {
                        // 원본 버킷
                        const option = document.createElement(
                            "option"
                        );

                        option.value = bucketName;
                        option.textContent = bucketName;
                        bucketSelect.appendChild(
                            option
                        );

                        // 목적지 버킷
                        const destinationOption = document.createElement(
                            "option"
                        );

                        destinationOption.value = bucketName;
                        destinationOption.textContent = bucketName;
                        destinationBucketSelect.appendChild(
                            destinationOption
                        );
                    }
                );

                setResult(
                    "버킷 조회 성공",
                    "조회된 버킷 수 : "
                    + data.buckets.length
                    + "\n\n"
                    + data.buckets.join("\n")
                );
                updateCurrentObject();
            } catch (error) {
                setResult(
                    "버킷 조회 실패",
                    error.message
                );
            }
        }

        // =========================================================
        // 현재 선택 정보
        // =========================================================

        function getSourceInfo() {
            const bucket = document.getElementById("bucket").value;
            const dir = document.getElementById("directory").value.trim();
            const file = document.getElementById("fileName").value.trim();

            if (!bucket) {
                alert("버킷을 선택해주세요.");

                return null;
            }

            if (!file) {
                alert("파일명을 입력해주세요.");

                return null;
            }

            return {
                bucket: bucket,
                dir: dir || "Root",
                file: file
            };

        }

        // =========================================================
        // 현재 Object 표시
        // =========================================================

        function updateCurrentObject() {
            const bucket = document.getElementById("bucket").value;
            const dir = document.getElementById("directory").value.trim();
            const file = document.getElementById("fileName").value.trim();

            let key = file;

            if (dir && dir !== "/" && dir.toLowerCase() !== "root") {
                key = dir.replace(/^\/+|\/+$/g, "") + "/" + file;
            }

            document.getElementById("currentObject").textContent = (bucket || "-") + " / " + (key || "-");
        }

        // =========================================================
        // READ
        // =========================================================

        async function readFile() {
            const source = getSourceInfo();
            if (!source) {

                return;
            }

            const readUrl = document.getElementById("readUrl").value.trim();

            const requestUrl = mcreateUrl(
                readUrl, {
                action: "read",
                bucket: source.bucket,
                dir: source.dir,
                file: source.file
            }
            );

            setResult("조회 중...", "GET " + requestUrl);
            try {
                const response = await fetch(
                    requestUrl, {
                    method: "GET"
                }
                );

                const text = await response.text();

                if (!response.ok) {
                    throw new Error(text);
                }

                setResult(
                    "조회 성공",
                    text
                );

            } catch (error) {
                setResult(
                    "조회 실패",
                    error.message
                );

            }

        }

        // =========================================================
        // DELETE
        // =========================================================

        async function deleteFile() {
            const source = getSourceInfo();

            if (!source) {
                return;
            }

            let key = source.file;

            if (source.dir !== "/" && source.dir.toLowerCase() !== "root") {
                key = source.dir.replace(/^\/+|\/+$/g, "") + "/" + source.file;

            }

            const deleteConfirm = confirm("정말 삭제하시겠습니까?\n\n" + "Bucket : " + source.bucket + "\n" + "Key : " + key);

            if (!deleteConfirm) {
                return;
            }

            const deleteUrl = document.getElementById("deleteUrl").value.trim();



            const requestUrl = createUrl(
                deleteUrl, {
                bucket: source.bucket,
                dir: source.dir,
                file: source.file
            }
            );

            setResult(
                "삭제 중...",
                "GET " + requestUrl
            );

            try {
                const response = await fetch(
                    requestUrl, {
                    method: "GET"
                }
                );

                const text = await response.text();

                if (!response.ok) {
                    throw new Error(text);
                }

                setResult(
                    "삭제 성공",
                    text
                );

            } catch (error) {
                setResult(
                    "삭제 실패",
                    error.message
                );
            }
        }

        // =========================================================
        // COPY
        // =========================================================

        async function copyFile() {
            const source = getSourceInfo();
            if (!source) {
                return;
            }

            let destinationBucket = document.getElementById("destinationBucket").value;

            if (destinationBucket === "same") {
                destinationBucket = source.bucket;
            }

            const destinationDirectory = document.getElementById("destinationDirectory").value.trim() || "Root";
            let destinationFile = document.getElementById("destinationFile").value.trim();

            // 목적지 파일명이 비어있으면
            // 원본 파일명 그대로 사용

            if (!destinationFile) {
                destinationFile = source.file;
            }

            const copyUrl = document.getElementById("copyUrl").value.trim();
            const requestUrl = createUrl(
                copyUrl, {
                bucket: source.bucket,
                dir: source.dir,
                file: source.file,
                dest_bucket: destinationBucket,
                dest_dir: destinationDirectory,
                dest_file: destinationFile
            }
            );

            setResult(
                "복사 중...",
                "GET " + requestUrl
            );

            try {
                const response = await fetch(
                    requestUrl, {
                    method: "GET"
                }
                );

                const text = await response.text();
                if (!response.ok) {
                    throw new Error(text);
                }

                setResult(
                    "복사 성공",
                    text
                );

            } catch (error) {
                setResult(
                    "복사 실패",
                    error.message
                );
            }
        }

        // =========================================================
        // Event
        // =========================================================

        document.getElementById("bucket").addEventListener(
            "change",
            updateCurrentObject
        );

        document.getElementById("directory").addEventListener(
            "input",
            updateCurrentObject
        );


        document.getElementById("fileName").addEventListener(
            "input",
            updateCurrentObject
        );

    </script>
</body>

</html>
